version: "2"
sql:
  - engine: "postgresql"
    schema:
      - "../scripts/postgres/user/*"
      - "../scripts/postgres/patrol/*"
      - "../scripts/postgres/base/*"
      - "../scripts/postgres/crime/*"
    queries: "./data/query"
    gen:
      go:
        package: "patroldb"
        out: "./data/gen"
        sql_package: "pgx/v5"
        emit_db_tags: true
        emit_json_tags: false
