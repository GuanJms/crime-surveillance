version: '3'

services:

  broker-service:
    build:
      context: ./../broker-service
      dockerfile: ./../broker-service/broker-service.dockerfile
    restart: always
    ports:
      - "8080:8080"
    environment:
      SECRET: ${SECRET}
    deploy:
      mode: replicated
      replicas: 1
  
  crime-service:
    build:
      context: ./../crime-service
      dockerfile: ./../crime-service/crime-service.dockerfile
    restart: always
    ports:
      - "50001:50001"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN_TEMPLATE}

  auth-service:
    build:
      context: ./../authentication-service
      dockerfile: ./../authentication-service/auth-service.dockerfile
    restart: always
    ports:
      - "50000:50000"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN_TEMPLATE}
      SECRET: ${SECRET}
  
  patrol-service:
    build:
      context: ./../patrol-service
      dockerfile: ./../patrol-service/patrol-service.dockerfile
    restart: always
    ports:
      - "50002:50002"
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN_TEMPLATE}

  postgres:
    image: 'postgres:16'
    ports:
      - "5435:5432"
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/