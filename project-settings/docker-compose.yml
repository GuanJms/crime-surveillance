version: '3'

services:

  caddy:
    build:
      context: ./../caddy
      dockerfile: ./../caddy/caddy.production.dockerfile
    restart: always
    ports:
      - "80:80"
      - "443:443"

  front-end:
    build:
      context: ./../front-end
      dockerfile: Dockerfile
    restart: always
    env_file:
      - ../project-settings/.env
      - ../project-settings/.env.local
    environment:
      # fallback if not defined in env file
      BROKER_SERVICE_URL: ${BROKER_SERVICE_URL:-http://broker-service:8080}

  broker-service:
    build:
      context: ./../broker-service
      dockerfile: ./../broker-service/broker-service.dockerfile
    restart: always
    environment:
      SECRET: ${SECRET}
    deploy:
      mode: replicated
      replicas: 1
  
  crime-service:
    build:
      context: ./../crime-service
      dockerfile: ./../crime-service/crime-service.dockerfile
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN}

  auth-service:
    build:
      context: ./../authentication-service
      dockerfile: ./../authentication-service/auth-service.dockerfile
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN}
      SECRET: ${SECRET}
  
  patrol-service:
    build:
      context: ./../patrol-service
      dockerfile: ./../patrol-service/patrol-service.dockerfile
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN}

  postgres:
    image: 'postgres:16'
    restart: always
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/
  
  redis:
    image: 'redis:8.0.3-alpine'
    restart: always
    deploy:
      mode: replicated
      replicas: 1
  