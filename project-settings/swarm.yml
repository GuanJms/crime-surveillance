version: '3'

services:
  caddy:
    image: jamesguan777/micro-caddy-production:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./../caddy/caddy_data:/data
      - ./../caddy/caddy_config:/config

  front-end:
    image: jamesguan777/crime-front-end:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    env_file:
      - ../project-settings/.env
      - ../project-settings/.env.local
    environment:
      BROKER_SERVICE_URL: ${BROKER_SERVICE_URL:-http://broker-service:8080}

  broker-service:
    image: jamesguan777/crime-broker-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      SECRET: ${SECRET}

  crime-service:
    image: jamesguan777/crime-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN_TEMPLATE}

  auth-service:
    image: jamesguan777/crime-auth-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN_TEMPLATE}
      SECRET: ${SECRET}

  patrol-service:
    image: jamesguan777/crime-patrol-service:1.0.0
    deploy:
      mode: replicated
      replicas: 1
    environment:
      DSN: ${DSN_TEMPLATE}

  postgres:
    image: 'postgres:16'
    deploy:
      mode: replicated
      replicas: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./db-data/postgres/:/var/lib/postgresql/data/
  
  redis:
    image: 'redis:8.0.3-alpine'
    deploy:
      mode: replicated
      replicas: 1
  
  
volumes:
  caddy_data: 
    external: true
  caddy_config: