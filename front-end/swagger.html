<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Crime Surveillance API – Swagger UI</title>
    <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist/swagger-ui.css" />
    <style>
      html, body { margin:0; height:100%; }
      #swagger { height:100%; }
    </style>
  </head>
  <body>
    <div id="swagger"></div>
    <script src="https://unpkg.com/swagger-ui-dist/swagger-ui-bundle.js"></script>
    <script>
      window.onload = () => {
        SwaggerUIBundle({
          url: "openapi.yaml", // served from same folder
          dom_id: "#swagger",
          presets: [SwaggerUIBundle.presets.apis],
        });
      };
    </script>
  </body>
</html>
